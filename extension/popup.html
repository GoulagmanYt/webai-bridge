<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebAI Bridge</title>
  <style>
    :root {
      --bg-canvas: #090b10;
      --bg-card: #11151d;
      --bg-inset: #0b0e14;
      --bg-hover: #171d28;
      --border-subtle: #1f2634;
      --border-strong: #2d374b;
      --text-primary: #eef2f8;
      --text-secondary: #9aa6ba;
      --text-muted: #68758c;
      --accent: #4f63f3;
      --accent-hover: #6274f7;
      --focus-ring: #7c8cf8;

      --sig-connected: #10b981;
      --sig-connected-fg: #34d399;
      --sig-connected-bg: rgba(16, 185, 129, 0.12);
      --sig-connected-bd: rgba(16, 185, 129, 0.30);

      --sig-busy: #f59e0b;
      --sig-busy-fg: #fbbf24;
      --sig-busy-bg: rgba(245, 158, 11, 0.12);
      --sig-busy-bd: rgba(245, 158, 11, 0.32);

      --sig-connecting: #60a5fa;
      --sig-connecting-fg: #93c5fd;
      --sig-connecting-bg: rgba(96, 165, 250, 0.12);
      --sig-connecting-bd: rgba(96, 165, 250, 0.30);

      --sig-standby: #94a3b8;
      --sig-standby-fg: #cbd5e1;
      --sig-standby-bg: rgba(148, 163, 184, 0.10);
      --sig-standby-bd: rgba(148, 163, 184, 0.24);

      --sig-error: #f43f5e;
      --sig-error-fg: #fda4af;
      --sig-error-bg: rgba(244, 63, 94, 0.12);
      --sig-error-bd: rgba(244, 63, 94, 0.32);

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 368px;
      padding: 14px;
      font-family: var(--font-sans);
      background:
        radial-gradient(120% 80% at 0% 0%, rgba(79, 99, 243, 0.10) 0%, transparent 55%),
        var(--bg-canvas);
      color: var(--text-primary);
      font-size: 12.5px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(79, 99, 243, 0.22), rgba(16, 185, 129, 0.14));
      border: 1px solid rgba(124, 140, 248, 0.30);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: #c7d2fe;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .title {
      font-weight: 650;
      font-size: 13.5px;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle {
      font-size: 10.5px;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    /* Semantic Status Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      white-space: nowrap;
      transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .badge[data-state="connected"],
    .badge.connected {
      background: var(--sig-connected-bg);
      border-color: var(--sig-connected-bd);
      color: var(--sig-connected-fg);
    }

    .badge[data-state="busy"],
    .badge.busy {
      background: var(--sig-busy-bg);
      border-color: var(--sig-busy-bd);
      color: var(--sig-busy-fg);
    }

    .badge[data-state="connecting"],
    .badge.connecting {
      background: var(--sig-connecting-bg);
      border-color: var(--sig-connecting-bd);
      color: var(--sig-connecting-fg);
    }

    .badge[data-state="standby"],
    .badge.standby {
      background: var(--sig-standby-bg);
      border-color: var(--sig-standby-bd);
      color: var(--sig-standby-fg);
    }

    .badge[data-state="replaced"],
    .badge.replaced,
    .badge[data-state="error"],
    .badge.error,
    .badge[data-state="disconnected"],
    .badge.disconnected {
      background: var(--sig-error-bg);
      border-color: var(--sig-error-bd);
      color: var(--sig-error-fg);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
      position: relative;
    }

    .dot.connected {
      background: var(--sig-connected);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55);
      animation: signal-pulse-ok 2.2s ease-out infinite;
    }

    .dot.busy {
      background: var(--sig-busy);
      box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6);
      animation: signal-pulse-busy 1.3s ease-out infinite;
    }

    .dot.connecting {
      background: var(--sig-connecting);
      animation: signal-pulse-connect 1.5s ease-out infinite;
    }

    .dot.standby {
      background: var(--sig-standby);
    }

    .dot.replaced,
    .dot.disconnected,
    .dot.error {
      background: var(--sig-error);
    }

    @keyframes signal-pulse-ok {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @keyframes signal-pulse-busy {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.55); }
      70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    @keyframes signal-pulse-connect {
      0% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.55); }
      70% { box-shadow: 0 0 0 6px rgba(96, 165, 250, 0); }
      100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0); }
    }

    /* Cards & Sections */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 11px 12px;
      margin-bottom: 10px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .card:last-of-type {
      margin-bottom: 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    .section-title {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    /* Telemetry Grid */
    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .metric {
      background: var(--bg-inset);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 7px 9px;
      min-width: 0;
    }

    .metric-label {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .metric-value {
      display: block;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Form Controls */
    .field-group {
      margin-bottom: 9px;
    }

    .field-group:last-of-type {
      margin-bottom: 0;
    }

    label.field-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .field-hint {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="number"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 7px 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-inset);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    input[type="number"]:hover,
    input[type="password"]:hover,
    input[type="text"]:hover {
      border-color: var(--border-strong);
    }

    input[type="number"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: var(--focus-ring);
      background: #0d111a;
    }

    input::placeholder {
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 11.5px;
    }

    .input-with-icon {
      padding-right: 34px;
    }

    .icon-btn {
      position: absolute;
      right: 4px;
      width: 26px;
      height: 26px;
      padding: 0;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 11px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.08s ease;
    }

    button:active {
      transform: translateY(0.5px);
    }

    button.primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    button.secondary {
      background: var(--bg-inset);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    button.secondary:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    button.compact {
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 550;
    }

    button.icon-only {
      flex: 0 0 auto;
      padding: 8px 10px;
    }

    /* Feedback Banner */
    .status-msg {
      margin-top: 8px;
      min-height: 16px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      border-radius: var(--radius-sm);
      transition: color 0.15s ease;
    }

    .status-msg.is-info {
      color: var(--sig-connecting-fg);
    }

    .status-msg.is-success {
      color: var(--sig-connected-fg);
    }

    .status-msg.is-warn {
      color: var(--sig-busy-fg);
    }

    .status-msg.is-error {
      color: var(--sig-error-fg);
    }

    /* Diagnostics Bar */
    .diag-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .diag-label-wrap {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .diag-title {
      font-size: 12px;
      font-weight: 550;
      color: var(--text-primary);
    }

    .desc-text {
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--bg-inset);
      border: 1px solid var(--border-strong);
      transition: background-color 0.2s ease, border-color 0.2s ease;
      border-radius: 999px;
    }

    .slider::before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      top: 2px;
      background-color: var(--text-secondary);
      transition: transform 0.2s ease, background-color 0.2s ease;
      border-radius: 50%;
    }

    .switch input:checked + .slider {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .switch input:checked + .slider::before {
      transform: translateX(16px);
      background-color: #ffffff;
    }

    .switch input:focus-visible + .slider {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .diag-actions {
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      gap: 7px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 17V9a8 8 0 0 1 16 0v8" />
          <path d="M2 17h20" />
          <path d="M8 17v-5a4 4 0 0 1 8 0v5" />
          <circle cx="12" cy="9" r="1.2" fill="currentColor" stroke="none" />
        </svg>
      </div>
      <div class="brand-text">
        <span class="title" id="bridgeTitle">WebAI Bridge</span>
        <span class="subtitle">Local MCP Orchestrator</span>
      </div>
    </div>

    <span class="badge" id="connectionBadge" data-state="disconnected" role="status" aria-live="polite">
      <span class="dot disconnected" id="statusDot" aria-hidden="true"></span>
      <span id="statusText">Checking...</span>
    </span>
  </header>

  <section class="card" aria-label="Live Telemetry">
    <div class="section-head">
      <span class="section-title">Active Tab Telemetry</span>
    </div>
    <div class="telemetry-grid">
      <div class="metric">
        <span class="metric-label">Provider</span>
        <span class="metric-value" id="providerValue">None</span>
      </div>
      <div class="metric">
        <span class="metric-label">Tab Mode</span>
        <span class="metric-value" id="tabModeValue">Standby</span>
      </div>
      <div class="metric">
        <span class="metric-label">Upload State</span>
        <span class="metric-value" id="uploadStateValue">IDLE</span>
      </div>
      <div class="metric">
        <span class="metric-label">Active Job</span>
        <span class="metric-value" id="jobValue">None</span>
      </div>
    </div>
  </section>

  <section class="card" aria-label="Connection Configuration">
    <div class="section-head">
      <span class="section-title">Bridge Connection</span>
    </div>

    <div class="field-group">
      <label class="field-label" for="portInput">
        <span>WebSocket Port</span>
        <span class="field-hint">1024–65535</span>
      </label>
      <div class="input-wrap">
        <input type="number" id="portInput" min="1024" max="65535" value="4545" inputmode="numeric" />
      </div>
    </div>

    <div class="field-group">
      <label class="field-label" for="tokenInput">
        <span>Session Auth Token</span>
        <span class="field-hint">Optional</span>
      </label>
      <div class="input-wrap">
        <input
          type="password"
          id="tokenInput"
          class="input-with-icon"
          autocomplete="off"
          spellcheck="false"
          placeholder="Token from ~/.webai-bridge/session.json"
        />
        <button
          type="button"
          class="icon-btn"
          id="toggleTokenBtn"
          aria-label="Show token"
          aria-pressed="false"
          title="Show or hide token"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="saveBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5" />
        </svg>
        <span>Save &amp; Reconnect</span>
      </button>
      <button type="button" class="secondary icon-only" id="refreshBtn" aria-label="Refresh status" title="Refresh active tab status">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <path d="M21 3v6h-6" />
        </svg>
      </button>
    </div>

    <div class="status-msg" id="feedbackMsg" role="status" aria-live="polite"></div>
  </section>

  <section class="card" aria-label="Diagnostics and Debug Logs">
    <div class="diag-toggle-row">
      <div class="diag-label-wrap">
        <span class="diag-title">Debug Mode</span>
        <span class="desc-text">Capture live DOM, send &amp; upload events.</span>
      </div>
      <label class="switch" title="Toggle verbose debug logging">
        <input type="checkbox" id="debugToggle" aria-label="Toggle Debug Mode" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="diag-actions">
      <button type="button" class="secondary compact" id="copyLogsBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        <span>Copy Logs</span>
      </button>
      <button type="button" class="secondary compact" id="clearLogsBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18" />
          <path d="M8 6V4h8v2" />
          <path d="M19 6l-1 14H6L5 6" />
        </svg>
        <span>Clear Logs</span>
      </button>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
